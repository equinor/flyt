apiVersion: radix.equinor.com/v1
kind: RadixApplication
metadata:
  name: flyt
spec:
  build:
    useBuildKit: true
  environments:
    - name: dev
      build:
        from: DEV
    - name: test
      build:
        from: TEST
    - name: qa
      build:
        from: main
    - name: prod
      build:
        from: PROD
  dnsExternalAlias: 
  - alias: dev.flyt.equinor.com
    environment: dev
    component: web
    useCertificateAutomation: true
  - alias: test.flyt.equinor.com
    environment: test
    component: web
    useCertificateAutomation: true
  - alias: qa.flyt.equinor.com
    environment: qa
    component: web
    useCertificateAutomation: true
  - alias: flyt.equinor.com
    environment: prod
    component: web
    useCertificateAutomation: true
  components:
    - name: web
      dockerfileName: Dockerfile
      publicPort: http
      ports:
        - name: http
          port: 3000
      environmentConfig:
        - environment: dev
          variables:
            API_BASEURL: https://api-flyt-api-dev.radix.equinor.com
            AUDIENCE: c001f24f-64a7-4f0c-bfe8-bf9c8e7aa74c
            AUTHORITY: https://login.microsoftonline.com/statoilsrm.onmicrosoft.com
            CLIENT_ID: e6e2f3c4-d6bd-4d71-a00e-be0c16a703da
            ENVIRONMENT: DEV
            SCOPE: c001f24f-64a7-4f0c-bfe8-bf9c8e7aa74c/api.access
            NEXT_PUBLIC_CONNECTION_STRING: InstrumentationKey=fe5e08f6-3b9d-4513-8f9c-eedf1f931267;IngestionEndpoint=https://northeurope-2.in.applicationinsights.azure.com/;LiveEndpoint=https://northeurope.livediagnostics.monitor.azure.com/;ApplicationId=2025dc43-1ce3-4c5d-9c44-850f5a549c1e
        - environment: test
          variables:
            API_BASEURL: https://api-flyt-api-test.radix.equinor.com
